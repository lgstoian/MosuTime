# A QMI8658 accelerometer, built as a virtual part.
#
# The real chip sits at I2C address 0x6A on SCL/SDA.  This part reports
# WHO_AM_I = 0x05 and the six acceleration bytes at 0x35..0x3A, little endian
# and scaled for +-4 g (8192 LSB/g), which is the range the firmware selects.
#
# Build (WSL or Linux, with a clone of esp-emulator checked out next to this
# repository):
#
#   ESP_COSIM_PROTO_DIR=/mnt/d/Code/esp-emulator/proto \
#     cargo build --release --target wasm32-unknown-unknown
[workspace]

[package]
name = "mosu_imu"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
esp-part = { path = "../../../../esp-emulator/esp-part" }

[profile.release]
opt-level = "s"
lto = true
strip = true
