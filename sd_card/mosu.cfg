# ============================================================================
#  MosuTime - fisierul de configurare
#
#  Copiaza acest fisier pe cardul SD, in radacina, cu numele:  mosu.cfg
#  Toate valorile text pot fi puse intre ghilimele.
#  Comentariile incep cu # la inceput de rand sau cu " #" dupa valoare.
#  Daca un rand are o greseala, doar acel rand este ignorat: ceasul porneste
#  mai departe cu valoarea anterioara (sau cu cea implicita).
# ============================================================================

[device]
# Numele apare doar in consola de diagnosticare.
name = "MosuTime"
# none, error, warn, info, debug, verbose
log_level = info


[display]
# Luminozitatea ecranului, 1..100. Este aceeasi la fiecare aprindere.
brightness = 55

# Cat timp ramane ecranul aprins dupa o atingere sau o ridicare a mainii.
screen_on_ms = 15000

# Trezirea ecranului.
wake_on_touch = true
wake_on_motion = true

# Unghiul minim (grade) al miscarii mainii care aprinde ecranul.
motion_angle_deg = 50

# Pauza minima intre doua treziri prin miscare.
motion_refractory_ms = 5000

# Cate citiri pe secunda face accelerometrul cat timp ecranul este stins.
# 4..8 este un compromis bun intre reactie si consum.
motion_poll_hz = 8

# Deplaseaza tot desenul cu 1-2 pixeli la acest interval, ca sa nu se
# "arda" literele in panoul AMOLED. 0 = dezactivat.
pixel_shift_sec = 180

# Cat timp clipeste chenarul dupa o dubla atingere. 0 = fara chenar.
tap_feedback_ms = 250


[colors]
# Culori RGB, in format #RRGGBB.
background = #000000

# Ora afisata ziua (AM) si noaptea (PM). Batranul stie daca e dimineata sau
# seara dupa culoare, fara sa citeasca AM/PM.
time_am = #FFFFFF
time_pm = #FFC98A

# Bateria: verde, portocaliu, rosu.
battery_green = #00E676
battery_orange = #FFAB00
battery_red = #FF1744

# Wi-Fi: gri = inca nesincronizat, verde = sincronizat, rosu = eroare.
wifi_idle = #8A8A8A
wifi_ok = #00E676
wifi_fail = #FF1744

# Chenarul care clipeste la dubla atingere.
tap_border = #FFFFFF


[status]
# Sub acest procent bateria devine portocalie, apoi rosie.
battery_green_min = 40
battery_orange_min = 15

show_battery = true
show_wifi = true

# Taie pictograma Wi-Fi cu o linie atunci cand ultima sincronizare a esuat.
wifi_fail_slash = true


[clock]
# Fusul orar folosit cand auto_timezone = false sau cand reteaua nu raspunde.
# Accepta nume IANA (Europe/Bucharest) sau forma POSIX.
timezone = Europe/Bucharest

# Cere reteaua sa spuna in ce fus orar suntem (dupa adresa IP).
auto_timezone = true

# Serviciul care raspunde cu fusul orar. Implicit este HTTP simplu, fara
# TLS: ip-api.com trimite doua linii, numele fusului si decalajul in secunde.
# Accepta si text simplu (ipapi.co/timezone/) sau JSON cu "timezone"/"offset".
# HTTPS functioneaza daca il configurezi explicit, dar costa o conexiune TLS.
geo_url = "http://ip-api.com/line/?fields=timezone,offset"

# Servere de timp. Sunt incercate in ordine.
ntp1 = "pool.ntp.org"
ntp2 = "time.google.com"

# La cate ore se face urmatoarea sincronizare (1..168).
sync_hours = 6

# Cate sincronizari pe zi (1..24). Cand este setat, are prioritate fata de
# sync_hours; 0 inseamna "foloseste sync_hours". Exemple: 4 = la 6 ore,
# 6 = la fiecare 4 ore, 24 = la fiecare ora.
sync_per_day = 0

# false = radioul porneste doar pentru sincronizare, apoi se opreste.
# true  = Wi-Fi ramane pornit (consuma mult mai mult).
wifi_always_on = false

# Folosit doar daca nu exista RTC valid si reteaua nu raspunde.
# Format: "AAAA-LL-ZZ HH:MM" (ora locala).
manual_time = ""


[wifi]
# Poti configura pana la 8 retele. Sunt incercate in ordinea asta.
network1_ssid = "Acasa"
network1_pass = "parola"

# network2_ssid = "Bunica"
# network2_pass = "alta parola"

# network3_ssid = "..."
# network3_pass = "..."


[announce]
# Dubla atingere spune ora cu voce tare.
enabled = true

# Cat de repede trebuie facute cele doua atingeri.
double_tap_ms = 650

# Cat de lunga poate fi o atingere ca sa conteze.
max_hold_ms = 400

# Cat de mult poate aluneca degetul intre apasare si ridicare.
max_move_px = 40

# Pauza dupa o anuntare, ca sa nu porneasca din nou din greseala.
cooldown_ms = 2000

# Volumul vocii, 0..100.
volume = 85

# Spune si ziua saptamanii la final.
announce_day = true

# Unde sunt fisierele .wav pe card (generate cu tools/gen_voice.py).
voice_dir = "/sdcard/voice"

# Pauza intre fragmentele de propozitie, in milisecunde.
clip_gap_ms = 60
