name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host tests and preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catch syntax errors in every Python tool, including the ones that are
      # not exercised by the steps below.
      - name: Compile the Python tools
        run: python -m compileall -q tools

      # The pronunciation lexicon is what keeps a clip from saying the wrong
      # word, and it needs no model to check.
      - name: Check the pronunciation lexicon
        run: python tools/mosu_g2p.py --selftest

      - name: Configure and run the host tests
        run: |
          cmake -S test/host -B test/host/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build test/host/build --parallel
          ./test/host/build/mosu_tests

      - name: Render the watch face
        run: |
          cmake -S sim -B sim/build -DCMAKE_BUILD_TYPE=Release
          cmake --build sim/build --parallel
          mkdir -p sim/out
          ./sim/build/mosu_sim sim/out

      - name: Check the voice generator
        run: |
          python tools/gen_voice.py --dry-run > clips.txt
          test "$(grep -c '\.wav' clips.txt)" -eq 78

      - name: List the rendered scenes
        run: ls -l sim/out/*.bmp

  firmware:
    name: ESP-IDF build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: "."

      # Informational only: reuse the build directory from the previous step
      # and print the size report.  A size regression must not hide the build
      # result, so this step is allowed to fail without failing the job.
      - name: Print the firmware size
        continue-on-error: true
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: "."
          command: idf.py size

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      # Only the host-buildable pure C components: they are free of ESP-IDF
      # headers, so cppcheck can analyse them without the toolchain.  There is
      # deliberately no clang-format gate: .clang-format is a reference for new
      # files, and reformatting the existing tree in CI would be pure noise.
      - name: cppcheck the pure C components
        run: |
          set -eu
          sources="components/mosu_core/src components/mosu_config/src components/mosu_session/src components/mosu_policy/src"
          includes="-I components/mosu_core/include -I components/mosu_config/include -I components/mosu_session/include -I components/mosu_policy/include"
          # Word splitting is intended: the lists above are argument lists.
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --std=c11 \
            --quiet \
            $includes $sources
